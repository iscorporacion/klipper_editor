#####################################################################
# STATUS BAR - 18 WS2812 LEDs
#####################################################################

[neopixel status_bar]
pin: PA8
chain_count: 18
color_order: GRB

# Default color: RGB(243, 232, 33)
initial_RED: 0.953
initial_GREEN: 0.910
initial_BLUE: 0.129

[gcode_macro STATUS_BAR_STATE]
variable_mode: 0
# 0 = standby
# 1 = bed_heating
# 2 = printing
variable_visible: 1
# 1 = visible
# 0 = hidden
variable_state_name: "startup"
variable_effect: "COMET"
variable_color: "0,120,255"
variable_secondary: "0,20,60"
variable_speed: 0.7
variable_manual: 0
gcode:


#####################################################################
# BED HEATING FIRE CYCLE STATE
#####################################################################

[gcode_macro STATUS_BAR_HEATING_CYCLE]
description: Internal state for bed heating fire animation

variable_active: 0

# Time displaying bed heating before each fire animation.
variable_interval: 15.0

# Total time the fire animation remains active.
variable_fire_duration: 3.0

# Comet speed.
variable_fire_speed: 0.7

# 1 = RIGHT
# -1 = LEFT
variable_direction: 1

gcode:


#####################################################################
# STANDBY CYLON EFFECT
#
# Knight Rider style sweep.
#####################################################################

[led_effect status_bar_standby_cylon]
autostart: false
frame_rate: 24
recalculate: true

leds:
    neopixel:status_bar

layers:
    cylon 1 0 top ({params.R|default(0.953)|float},{params.G|default(0.910)|float},{params.B|default(0.129)|float})


#####################################################################
# BED HEATING EFFECT
#
# Fills the strip according to heater_bed temperature vs target.
#####################################################################

[led_effect status_bar_bed_heating]
autostart: false
frame_rate: 24
heater: heater_bed

leds:
    neopixel:status_bar

layers:
    heatergauge -1 0 add (1.0,0.05,0.0),(1.0,0.35,0.0),(1.0,0.75,0.0)
    static 0 0 top (0.02,0.002,0.0)


#####################################################################
# PRINT PROGRESS EFFECT
#
# Bright yellow fills according to Klipper print progress.
#####################################################################

[led_effect status_bar_print_progress]
autostart: false
frame_rate: 12
recalculate: true

leds:
    neopixel:status_bar

layers:
    progress -1 0 add ({params.PR|default(0.0)|float},{params.PG|default(0.47)|float},{params.PB|default(1.0)|float}),({params.PR|default(0.0)|float},{params.PG|default(0.47)|float},{params.PB|default(1.0)|float})
    static 0 0 top ({params.BR|default(0.008)|float},{params.BG|default(0.008)|float},{params.BB|default(0.008)|float})

#####################################################################
# FIRE WAVE
#####################################################################

[led_effect status_bar_fire_wave]
autostart: false
frame_rate: 30
recalculate: true

leds:
    neopixel:status_bar

layers:
    comet {params.RATE|default(0.7)|float} 0.35 add (1.0,0.05,0.0),(1.0,0.4,0.0),(1.0,0.9,0.1)
    static 0 0 top (0.03,0.002,0.0)

    
#####################################################################
# STANDBY MACRO
#
# Examples:
#
# STATUS_BAR_STANDBY
# STATUS_BAR_STANDBY REPEATS=5
# STATUS_BAR_STANDBY COLOR=255,0,0
# STATUS_BAR_STANDBY REPEATS=4 COLOR=0,120,255
#####################################################################

[gcode_macro STATUS_BAR_STANDBY]
description: Run standby Cylon effect and finish with a static color

variable_red: 243
variable_green: 232
variable_blue: 33
variable_cycle_time: 2.0

gcode:
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=mode VALUE=0

    SET_GCODE_VARIABLE MACRO=STATUS_BAR_HEATING_CYCLE VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=STATUS_BAR_HEATING_FIRE DURATION=0
    UPDATE_DELAYED_GCODE ID=STATUS_BAR_HEATING_RETURN DURATION=0

    {% set REPEATS = params.REPEATS|default(3)|int %}
    {% set COLOR = params.COLOR|default("243,232,33") %}
    {% set RGB = COLOR.split(',') %}

    {% if RGB|length != 3 %}
        {action_raise_error("COLOR must use R,G,B format. Example: COLOR=243,232,33")}
    {% endif %}

    {% set R255 = RGB[0]|int %}
    {% set G255 = RGB[1]|int %}
    {% set B255 = RGB[2]|int %}

    {% set DURATION = REPEATS * printer["gcode_macro STATUS_BAR_STANDBY"].cycle_time %}

    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STANDBY VARIABLE=red VALUE={R255}
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STANDBY VARIABLE=green VALUE={G255}
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STANDBY VARIABLE=blue VALUE={B255}

    UPDATE_DELAYED_GCODE ID=STATUS_BAR_STANDBY_FINISH DURATION=0
    STOP_LED_EFFECTS LEDS="neopixel:status_bar"
    SET_LED_EFFECT EFFECT=status_bar_standby_cylon REPLACE=1 RESTART=1
    UPDATE_DELAYED_GCODE ID=STATUS_BAR_STANDBY_FINISH DURATION={DURATION}


#####################################################################
# STANDBY FINISH
#
# Stops Cylon and applies the selected static RGB color.
#####################################################################

[delayed_gcode STATUS_BAR_STANDBY_FINISH]
gcode:
    {% set R255 = printer["gcode_macro STATUS_BAR_STANDBY"].red|int %}
    {% set G255 = printer["gcode_macro STATUS_BAR_STANDBY"].green|int %}
    {% set B255 = printer["gcode_macro STATUS_BAR_STANDBY"].blue|int %}

    {% set R = R255 / 255.0 %}
    {% set G = G255 / 255.0 %}
    {% set B = B255 / 255.0 %}

    SET_LED_EFFECT EFFECT=status_bar_standby_cylon STOP=1

    SET_LED LED=status_bar RED={R} GREEN={G} BLUE={B} SYNC=0


#####################################################################
# BED HEATING MACRO
#####################################################################

[gcode_macro STATUS_BAR_BED_HEATING]
description: Show bed heating progress with periodic fire wave
gcode:
    {% set INTERVAL = params.FIRE_INTERVAL|default(15)|float %}
    {% set FIRE_DURATION = params.FIRE_DURATION|default(3)|float %}
    {% set DIRECTION = params.FIRE_DIRECTION|default("RIGHT")|upper %}
    {% set SPEED = params.FIRE_SPEED|default(0.7)|float %}

    {% if DIRECTION == "RIGHT" %}
        {% set DIR = 1 %}
    {% elif DIRECTION == "LEFT" %}
        {% set DIR = -1 %}
    {% else %}
        {action_raise_error("FIRE_DIRECTION must be LEFT or RIGHT")}
    {% endif %}

    {% if INTERVAL <= 0 %}
        {action_raise_error("FIRE_INTERVAL must be greater than 0")}
    {% endif %}

    {% if FIRE_DURATION <= 0 %}
        {action_raise_error("FIRE_DURATION must be greater than 0")}
    {% endif %}

    {% if SPEED <= 0 %}
        {action_raise_error("FIRE_SPEED must be greater than 0")}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=mode VALUE=1

    SET_GCODE_VARIABLE MACRO=STATUS_BAR_HEATING_CYCLE VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_HEATING_CYCLE VARIABLE=interval VALUE={INTERVAL}
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_HEATING_CYCLE VARIABLE=fire_duration VALUE={FIRE_DURATION}
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_HEATING_CYCLE VARIABLE=fire_speed VALUE={SPEED}
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_HEATING_CYCLE VARIABLE=direction VALUE={DIR}

    # Cancel any old heating/fire timers before starting a fresh cycle.
    UPDATE_DELAYED_GCODE ID=STATUS_BAR_HEATING_FIRE DURATION=0
    UPDATE_DELAYED_GCODE ID=STATUS_BAR_HEATING_RETURN DURATION=0

    _STATUS_BAR_SHOW_BED_HEATING

    # First fire burst after the configured heating interval.
    UPDATE_DELAYED_GCODE ID=STATUS_BAR_HEATING_FIRE DURATION={INTERVAL}

[gcode_macro _STATUS_BAR_SHOW_BED_HEATING]
description: Internal helper for bed heating status
gcode:
    {% set VISIBLE = printer["gcode_macro STATUS_BAR_STATE"].visible|int %}

    {% if VISIBLE == 1 %}
        STOP_LED_EFFECTS LEDS="neopixel:status_bar"
        SET_LED_EFFECT EFFECT=status_bar_bed_heating REPLACE=1 RESTART=1
    {% endif %}
    
[delayed_gcode STATUS_BAR_HEATING_FIRE]
gcode:
    {% set ACTIVE = printer["gcode_macro STATUS_BAR_HEATING_CYCLE"].active|int %}
    {% set MODE = printer["gcode_macro STATUS_BAR_STATE"].mode|int %}
    {% set VISIBLE = printer["gcode_macro STATUS_BAR_STATE"].visible|int %}

    {% set DIRECTION = printer["gcode_macro STATUS_BAR_HEATING_CYCLE"].direction|int %}
    {% set SPEED = printer["gcode_macro STATUS_BAR_HEATING_CYCLE"].fire_speed|float %}
    {% set FIRE_DURATION = printer["gcode_macro STATUS_BAR_HEATING_CYCLE"].fire_duration|float %}

    {% set BED_TEMP = printer.heater_bed.temperature|float %}
    {% set BED_TARGET = printer.heater_bed.target|float %}
    {% set PRINT_STATE = printer.print_stats.state|string %}

    {% if ACTIVE == 1
          and MODE == 1
          and VISIBLE == 1
          and BED_TARGET > 0
          and BED_TEMP < BED_TARGET
          and PRINT_STATE not in ["printing", "paused"] %}

        {% if DIRECTION == 1 %}
            {% set RATE = SPEED %}
            {% set DIR_NAME = "RIGHT" %}
        {% else %}
            {% set RATE = -SPEED %}
            {% set DIR_NAME = "LEFT" %}
        {% endif %}

        STOP_LED_EFFECTS LEDS="neopixel:status_bar"
        SET_LED_EFFECT EFFECT=status_bar_fire_wave REPLACE=1 RESTART=1 RATE={RATE}

        RESPOND TYPE=echo MSG="STATUS BAR FIRE | Full-strip wave | Direction: {DIR_NAME} | Speed: {SPEED}"

        UPDATE_DELAYED_GCODE ID=STATUS_BAR_HEATING_RETURN DURATION={FIRE_DURATION}

    {% elif ACTIVE == 1 and MODE == 1 and BED_TARGET > 0 and BED_TEMP >= BED_TARGET %}
        SET_GCODE_VARIABLE MACRO=STATUS_BAR_HEATING_CYCLE VARIABLE=active VALUE=0
        UPDATE_DELAYED_GCODE ID=STATUS_BAR_HEATING_RETURN DURATION=0
        _STATUS_BAR_SHOW_BED_HEATING

    {% endif %}

[delayed_gcode STATUS_BAR_HEATING_RETURN]
gcode:
    {% set ACTIVE = printer["gcode_macro STATUS_BAR_HEATING_CYCLE"].active|int %}
    {% set MODE = printer["gcode_macro STATUS_BAR_STATE"].mode|int %}
    {% set BED_TEMP = printer.heater_bed.temperature|float %}
    {% set BED_TARGET = printer.heater_bed.target|float %}
    {% set PRINT_STATE = printer.print_stats.state|string %}
    {% set INTERVAL = printer["gcode_macro STATUS_BAR_HEATING_CYCLE"].interval|float %}

    {% if ACTIVE == 1
          and MODE == 1
          and BED_TARGET > 0
          and BED_TEMP < BED_TARGET
          and PRINT_STATE not in ["printing", "paused"] %}
        _STATUS_BAR_SHOW_BED_HEATING

        UPDATE_DELAYED_GCODE ID=STATUS_BAR_HEATING_FIRE DURATION={INTERVAL}

    {% elif ACTIVE == 1 and MODE == 1 and BED_TARGET > 0 and BED_TEMP >= BED_TARGET %}
        SET_GCODE_VARIABLE MACRO=STATUS_BAR_HEATING_CYCLE VARIABLE=active VALUE=0
        _STATUS_BAR_SHOW_BED_HEATING

    {% endif %}   
#####################################################################
# PRINT PROGRESS MACRO
#####################################################################

[gcode_macro STATUS_BAR_PRINTING]
description: Show print progress with configurable colors
gcode:
    {% set PROGRESS = params.PROGRESS_COLOR|default("243,232,33") %}
    {% set REMAINING = params.REMAINING_COLOR|default("40,40,40") %}
    {% set BACKGROUND = params.BACKGROUND_COLOR|default("3,3,3") %}

    {% set P = PROGRESS.split(',') %}
    {% set R = REMAINING.split(',') %}
    {% set B = BACKGROUND.split(',') %}

    {% if P|length != 3 %}
        {action_raise_error("PROGRESS_COLOR must use R,G,B format")}
    {% endif %}

    {% if R|length != 3 %}
        {action_raise_error("REMAINING_COLOR must use R,G,B format")}
    {% endif %}

    {% if B|length != 3 %}
        {action_raise_error("BACKGROUND_COLOR must use R,G,B format")}
    {% endif %}

    {% set PR = P[0]|float / 255.0 %}
    {% set PG = P[1]|float / 255.0 %}
    {% set PB = P[2]|float / 255.0 %}

    {% set RR = R[0]|float / 255.0 %}
    {% set RG = R[1]|float / 255.0 %}
    {% set RB = R[2]|float / 255.0 %}

    {% set BR = B[0]|float / 255.0 %}
    {% set BG = B[1]|float / 255.0 %}
    {% set BB = B[2]|float / 255.0 %}

    SET_GCODE_VARIABLE MACRO=STATUS_BAR_HEATING_CYCLE VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=STATUS_BAR_HEATING_FIRE DURATION=0
    UPDATE_DELAYED_GCODE ID=STATUS_BAR_HEATING_RETURN DURATION=0

    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=mode VALUE=2

    {% set VISIBLE = printer["gcode_macro STATUS_BAR_STATE"].visible|int %}

    {% if VISIBLE == 1 %}
        STOP_LED_EFFECTS LEDS="neopixel:status_bar"
        SET_LED_EFFECT EFFECT=status_bar_print_progress REPLACE=1 RESTART=1 PR={PR} PG={PG} PB={PB} BR={BR} BG={BG} BB={BB}
    {% endif %}

[gcode_macro STATUS_BAR_TEST_PROGRESS]
description: Animate status bar progress up to a target percentage

variable_target: 40
variable_current: 0
variable_step: 5
variable_delay: 0.15

variable_pr: 0.0
variable_pg: 0.47
variable_pb: 1.0

variable_br: 0.008
variable_bg: 0.008
variable_bb: 0.008

gcode:
    {% set TARGET = params.PERCENT|default(40)|int %}
    {% set STEP = params.STEP|default(5)|int %}
    {% set DELAY = params.DELAY|default(0.15)|float %}

    {% set PROGRESS = params.PROGRESS_COLOR|default("0,120,255") %}
    {% set BACKGROUND = params.BACKGROUND_COLOR|default("2,2,2") %}

    {% set P = PROGRESS.split(',') %}
    {% set B = BACKGROUND.split(',') %}

    {% if TARGET < 0 or TARGET > 100 %}
        {action_raise_error("PERCENT must be between 0 and 100")}
    {% endif %}

    {% if STEP < 1 %}
        {action_raise_error("STEP must be 1 or greater")}
    {% endif %}

    {% set PR = P[0]|float / 255.0 %}
    {% set PG = P[1]|float / 255.0 %}
    {% set PB = P[2]|float / 255.0 %}

    {% set BR = B[0]|float / 255.0 %}
    {% set BG = B[1]|float / 255.0 %}
    {% set BB = B[2]|float / 255.0 %}

    SET_GCODE_VARIABLE MACRO=STATUS_BAR_TEST_PROGRESS VARIABLE=target VALUE={TARGET}
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_TEST_PROGRESS VARIABLE=current VALUE=0
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_TEST_PROGRESS VARIABLE=step VALUE={STEP}
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_TEST_PROGRESS VARIABLE=delay VALUE={DELAY}

    SET_GCODE_VARIABLE MACRO=STATUS_BAR_TEST_PROGRESS VARIABLE=pr VALUE={PR}
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_TEST_PROGRESS VARIABLE=pg VALUE={PG}
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_TEST_PROGRESS VARIABLE=pb VALUE={PB}

    SET_GCODE_VARIABLE MACRO=STATUS_BAR_TEST_PROGRESS VARIABLE=br VALUE={BR}
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_TEST_PROGRESS VARIABLE=bg VALUE={BG}
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_TEST_PROGRESS VARIABLE=bb VALUE={BB}

    STOP_LED_EFFECTS LEDS="neopixel:status_bar"

    SET_LED_EFFECT EFFECT=status_bar_print_progress REPLACE=1 RESTART=1 PR={PR} PG={PG} PB={PB} BR={BR} BG={BG} BB={BB}

    M73 P0

    UPDATE_DELAYED_GCODE ID=STATUS_BAR_TEST_ANIMATION DURATION=0.1

[delayed_gcode STATUS_BAR_TEST_ANIMATION]
gcode:
    {% set TARGET = printer["gcode_macro STATUS_BAR_TEST_PROGRESS"].target|int %}
    {% set CURRENT = printer["gcode_macro STATUS_BAR_TEST_PROGRESS"].current|int %}
    {% set STEP = printer["gcode_macro STATUS_BAR_TEST_PROGRESS"].step|int %}
    {% set DELAY = printer["gcode_macro STATUS_BAR_TEST_PROGRESS"].delay|float %}

    {% set NEXT = CURRENT + STEP %}

    {% if NEXT > TARGET %}
        {% set NEXT = TARGET %}
    {% endif %}

    M73 P{NEXT}

    SET_GCODE_VARIABLE MACRO=STATUS_BAR_TEST_PROGRESS VARIABLE=current VALUE={NEXT}

    {% if NEXT < TARGET %}
        UPDATE_DELAYED_GCODE ID=STATUS_BAR_TEST_ANIMATION DURATION={DELAY}
    {% else %}
        RESPOND TYPE=echo MSG="STATUS BAR TEST | Animation complete at {TARGET}%"
    {% endif %}

[gcode_macro STATUS_BAR_TEST_CYLON]
description: Test Cylon effect with custom RGB color
gcode:
    {% set COLOR = params.COLOR|default("243,232,33") %}
    {% set RGB = COLOR.split(',') %}

    {% if RGB|length != 3 %}
        {action_raise_error("COLOR must use R,G,B format")}
    {% endif %}

    {% set R255 = RGB[0]|int %}
    {% set G255 = RGB[1]|int %}
    {% set B255 = RGB[2]|int %}

    {% if R255 < 0 or R255 > 255 or
          G255 < 0 or G255 > 255 or
          B255 < 0 or B255 > 255 %}
        {action_raise_error("RGB values must be between 0 and 255")}
    {% endif %}

    {% set R = R255 / 255.0 %}
    {% set G = G255 / 255.0 %}
    {% set B = B255 / 255.0 %}

    STOP_LED_EFFECTS LEDS="neopixel:status_bar"

    SET_LED_EFFECT EFFECT=status_bar_standby_cylon REPLACE=1 RESTART=1 R={R} G={G} B={B}

    RESPOND TYPE=echo MSG="STATUS BAR CYLON TEST | RGB: {R255},{G255},{B255}"

[gcode_macro STATUS_BAR_TEST_FIRE]
description: Test fire wave with LEFT or RIGHT direction
gcode:
    {% set DIRECTION = params.DIRECTION|default("RIGHT")|upper %}
    {% set SPEED = params.SPEED|default(0.7)|float %}

    {% if DIRECTION == "LEFT" %}
        {% set RATE = -SPEED %}
    {% elif DIRECTION == "RIGHT" %}
        {% set RATE = SPEED %}
    {% else %}
        {action_raise_error("DIRECTION must be LEFT or RIGHT")}
    {% endif %}

    STOP_LED_EFFECTS LEDS="neopixel:status_bar"

    SET_LED_EFFECT EFFECT=status_bar_fire_wave REPLACE=1 RESTART=1 RATE={RATE}

    RESPOND TYPE=echo MSG="STATUS BAR FIRE | Direction: {DIRECTION} | Speed: {SPEED}"
    
#####################################################################
# STATIC COLOR MACRO
#
# Example:
# STATUS_BAR_COLOR COLOR=0,255,0
#####################################################################

[gcode_macro STATUS_BAR_COLOR]
description: Set the complete status bar to a static RGB color
gcode:
    {% set COLOR = params.COLOR|default("243,232,33") %}
    {% set RGB = COLOR.split(',') %}

    {% if RGB|length != 3 %}
        {action_raise_error("COLOR must use R,G,B format")}
    {% endif %}

    {% set R255 = RGB[0]|int %}
    {% set G255 = RGB[1]|int %}
    {% set B255 = RGB[2]|int %}

    {% if R255 < 0 or R255 > 255 or
          G255 < 0 or G255 > 255 or
          B255 < 0 or B255 > 255 %}
        {action_raise_error("RGB values must be between 0 and 255")}
    {% endif %}

    {% set R = R255 / 255.0 %}
    {% set G = G255 / 255.0 %}
    {% set B = B255 / 255.0 %}

    STOP_LED_EFFECTS LEDS="neopixel:status_bar"

    SET_LED LED=status_bar RED={R} GREEN={G} BLUE={B} SYNC=0
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=manual VALUE=1
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=state_name VALUE='"manual"'
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=effect VALUE='"STATIC"'
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=color VALUE='"{COLOR}"'


#####################################################################
# STATUS BAR OFF
#####################################################################

[gcode_macro STATUS_BAR_OFF]
description: Turn off the complete status bar
gcode:
    STOP_LED_EFFECTS LEDS="neopixel:status_bar"
    SET_LED LED=status_bar RED=0 GREEN=0 BLUE=0 SYNC=0
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=visible VALUE=0


#####################################################################
# STARTUP
#
# Runs automatically when Klipper becomes ready.
#####################################################################
[gcode_macro STATUS_BAR_HIDE]
description: Hide status bar without changing its logical state
gcode:
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=visible VALUE=0

    # Stop LED output only
    STOP_LED_EFFECTS LEDS="neopixel:status_bar"
    SET_LED LED=status_bar RED=0 GREEN=0 BLUE=0 SYNC=0

    RESPOND TYPE=echo MSG="STATUS BAR | Hidden"
    
[gcode_macro STATUS_BAR_SHOW]
description: Restore status bar using the current logical state
gcode:
    {% set STATE = printer["gcode_macro STATUS_BAR_STATE"].state_name|string %}

    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=visible VALUE=1
    {% if STATE in ['startup','standby','homing','heating','printing','paused','mmu','complete','cancelled','error'] %}
        _STATUS_BAR_SET_STATE STATE={STATE|upper}
    {% else %}
        STATUS_BAR_STANDBY
    {% endif %}

    RESPOND TYPE=echo MSG="STATUS BAR | Visible"
    
[delayed_gcode STATUS_BAR_BED_WATCH]
initial_duration: 0
gcode:
    {% set BED_TARGET = printer.heater_bed.target|float %}
    {% set BED_TEMP = printer.heater_bed.temperature|float %}
    {% set PRINT_STATE = printer.print_stats.state|string %}
    {% set MODE = printer["gcode_macro STATUS_BAR_STATE"].mode|int %}
    {% set HEATING_ACTIVE = printer["gcode_macro STATUS_BAR_HEATING_CYCLE"].active|int %}

    # Reaching the target always stops the heating animation immediately.
    {% if BED_TARGET > 0 and MODE == 1 and HEATING_ACTIVE == 1 and BED_TEMP >= BED_TARGET %}
        SET_GCODE_VARIABLE MACRO=STATUS_BAR_HEATING_CYCLE VARIABLE=active VALUE=0
        UPDATE_DELAYED_GCODE ID=STATUS_BAR_HEATING_FIRE DURATION=0
        UPDATE_DELAYED_GCODE ID=STATUS_BAR_HEATING_RETURN DURATION=0
        _STATUS_BAR_SHOW_BED_HEATING

    # Other automatic mode changes only apply while not printing or paused.
    {% elif PRINT_STATE not in ["printing", "paused"] %}

        # Bed was turned on manually from Mainsail.
        {% if BED_TARGET > 0 and MODE == 0 %}
            STATUS_BAR_BED_HEATING

        # Bed was turned off manually.
        {% elif BED_TARGET <= 0 and MODE == 1 %}
            STATUS_BAR_STANDBY
        {% endif %}

    {% endif %}

    # Superseded by STATUS_BAR_AUTOMATION; kept for compatibility.
    
[delayed_gcode STATUS_BAR_STARTUP]
initial_duration: 2
gcode:
    STATUS_BAR_APPLY_STATE STATE=STARTUP AUTO=1
    UPDATE_DELAYED_GCODE ID=STATUS_BAR_AUTOMATION DURATION=2


#####################################################################
# K-EDITOR STATUS BAR CONFIGURATION
#####################################################################

[gcode_macro _STATUS_BAR_VARS]
variable_brightness: 0.70
variable_automatic: 1
variable_startup_effect: "COMET"
variable_startup_color: "0,120,255"
variable_startup_secondary: "0,15,45"
variable_startup_speed: 0.7
variable_standby_effect: "CYLON"
variable_standby_color: "243,232,33"
variable_standby_secondary: "30,28,2"
variable_standby_speed: 1.0
variable_homing_effect: "COMET"
variable_homing_color: "40,150,255"
variable_homing_secondary: "0,15,40"
variable_homing_speed: 0.8
variable_heating_effect: "HEATER"
variable_heating_color: "255,35,0"
variable_heating_secondary: "255,190,0"
variable_heating_speed: 0.7
variable_printing_effect: "PROGRESS"
variable_printing_color: "0,120,255"
variable_printing_secondary: "3,3,3"
variable_printing_speed: 1.0
variable_paused_effect: "BREATHING"
variable_paused_color: "255,145,0"
variable_paused_secondary: "20,5,0"
variable_paused_speed: 1.2
variable_mmu_effect: "COMET"
variable_mmu_color: "170,70,255"
variable_mmu_secondary: "15,2,30"
variable_mmu_speed: 0.8
variable_complete_effect: "CYLON"
variable_complete_color: "0,255,80"
variable_complete_secondary: "0,25,5"
variable_complete_speed: 1.0
variable_cancelled_effect: "BLINK"
variable_cancelled_color: "255,45,20"
variable_cancelled_secondary: "20,0,0"
variable_cancelled_speed: 1.0
variable_error_effect: "BLINK"
variable_error_color: "255,0,0"
variable_error_secondary: "25,0,0"
variable_error_speed: 0.45
gcode:

[led_effect status_bar_dynamic_cylon]
autostart: false
frame_rate: 24
recalculate: true
leds:
    neopixel:status_bar
layers:
    cylon {params.SPEED|default(1.0)|float} 0 top ({params.R|default(1.0)|float},{params.G|default(1.0)|float},{params.B|default(1.0)|float})

[led_effect status_bar_dynamic_breathing]
autostart: false
frame_rate: 24
recalculate: true
leds:
    neopixel:status_bar
layers:
    breathing {params.SPEED|default(1.0)|float} 0 top ({params.R|default(1.0)|float},{params.G|default(1.0)|float},{params.B|default(1.0)|float})

[led_effect status_bar_dynamic_blink]
autostart: false
frame_rate: 20
recalculate: true
leds:
    neopixel:status_bar
layers:
    blink {params.SPEED|default(1.0)|float} 0 top ({params.R|default(1.0)|float},{params.G|default(0.0)|float},{params.B|default(0.0)|float})

[led_effect status_bar_dynamic_comet]
autostart: false
frame_rate: 30
recalculate: true
leds:
    neopixel:status_bar
layers:
    comet {params.SPEED|default(0.7)|float} 0.35 add ({params.R|default(1.0)|float},{params.G|default(1.0)|float},{params.B|default(1.0)|float}),({params.SR|default(0.0)|float},{params.SG|default(0.0)|float},{params.SB|default(0.0)|float})

[led_effect status_bar_dynamic_progress]
autostart: false
frame_rate: 12
recalculate: true
leds:
    neopixel:status_bar
layers:
    progress -1 0 add ({params.R|default(0.0)|float},{params.G|default(0.47)|float},{params.B|default(1.0)|float}),({params.R|default(0.0)|float},{params.G|default(0.47)|float},{params.B|default(1.0)|float})
    static 0 0 top ({params.SR|default(0.008)|float},{params.SG|default(0.008)|float},{params.SB|default(0.008)|float})

[led_effect status_bar_dynamic_heater]
autostart: false
frame_rate: 24
recalculate: true
heater: heater_bed
leds:
    neopixel:status_bar
layers:
    heatergauge -1 0 add ({params.R|default(1.0)|float},{params.G|default(0.05)|float},{params.B|default(0.0)|float}),({params.SR|default(1.0)|float},{params.SG|default(0.75)|float},{params.SB|default(0.0)|float})
    static 0 0 top (0.01,0.001,0.0)

[gcode_macro _STATUS_BAR_SET_STATE]
description: Internal configurable status renderer
gcode:
    {% set STATE = params.STATE|default('STANDBY')|upper %}
    {% set V = printer['gcode_macro _STATUS_BAR_VARS'] %}
    {% set S = printer['gcode_macro STATUS_BAR_STATE'] %}
    {% set KEY = STATE|lower %}
    {% set EFFECT = V[KEY ~ '_effect']|upper %}
    {% set COLOR = V[KEY ~ '_color'].split(',') %}
    {% set SECONDARY = V[KEY ~ '_secondary'].split(',') %}
    {% set SPEED = V[KEY ~ '_speed']|float %}
    {% set BRIGHTNESS = V.brightness|float %}
    {% set R = COLOR[0]|float / 255.0 * BRIGHTNESS %}
    {% set G = COLOR[1]|float / 255.0 * BRIGHTNESS %}
    {% set B = COLOR[2]|float / 255.0 * BRIGHTNESS %}
    {% set SR = SECONDARY[0]|float / 255.0 * BRIGHTNESS %}
    {% set SG = SECONDARY[1]|float / 255.0 * BRIGHTNESS %}
    {% set SB = SECONDARY[2]|float / 255.0 * BRIGHTNESS %}
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=state_name VALUE='"{KEY}"'
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=effect VALUE='"{EFFECT}"'
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=color VALUE='"{V[KEY ~ '_color']}"'
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=secondary VALUE='"{V[KEY ~ '_secondary']}"'
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=speed VALUE={SPEED}
    {% if S.visible|int == 1 %}
        STOP_LED_EFFECTS LEDS="neopixel:status_bar"
        {% if EFFECT == 'STATIC' %}
            SET_LED LED=status_bar RED={R} GREEN={G} BLUE={B} SYNC=0
        {% elif EFFECT == 'CYLON' %}
            SET_LED_EFFECT EFFECT=status_bar_dynamic_cylon REPLACE=1 RESTART=1 SPEED={SPEED} R={R} G={G} B={B}
        {% elif EFFECT == 'BREATHING' %}
            SET_LED_EFFECT EFFECT=status_bar_dynamic_breathing REPLACE=1 RESTART=1 SPEED={SPEED} R={R} G={G} B={B}
        {% elif EFFECT == 'BLINK' %}
            SET_LED_EFFECT EFFECT=status_bar_dynamic_blink REPLACE=1 RESTART=1 SPEED={SPEED} R={R} G={G} B={B}
        {% elif EFFECT in ['COMET', 'FIRE'] %}
            SET_LED_EFFECT EFFECT=status_bar_dynamic_comet REPLACE=1 RESTART=1 SPEED={SPEED} R={R} G={G} B={B} SR={SR} SG={SG} SB={SB}
        {% elif EFFECT == 'PROGRESS' %}
            SET_LED_EFFECT EFFECT=status_bar_dynamic_progress REPLACE=1 RESTART=1 R={R} G={G} B={B} SR={SR} SG={SG} SB={SB}
        {% elif EFFECT == 'HEATER' %}
            SET_LED_EFFECT EFFECT=status_bar_dynamic_heater REPLACE=1 RESTART=1 R={R} G={G} B={B} SR={SR} SG={SG} SB={SB}
        {% endif %}
    {% endif %}

[gcode_macro STATUS_BAR_APPLY_STATE]
description: Apply a configured state; AUTO=1 allows the automatic watcher to keep control
gcode:
    {% set AUTO = params.AUTO|default(0)|int %}
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=manual VALUE={0 if AUTO else 1}
    _STATUS_BAR_SET_STATE STATE={params.STATE|default('STANDBY')}

[gcode_macro STATUS_BAR_TEST_STATE]
description: Preview a configured state until STATUS_BAR_RESTORE
gcode:
    STATUS_BAR_APPLY_STATE STATE={params.STATE|default('STANDBY')} AUTO=0

[gcode_macro STATUS_BAR_RESTORE]
description: Return control to automatic printer state detection
gcode:
    SET_GCODE_VARIABLE MACRO=STATUS_BAR_STATE VARIABLE=manual VALUE=0
    UPDATE_DELAYED_GCODE ID=STATUS_BAR_AUTOMATION DURATION=0.1

[gcode_macro _STATUS_BAR_SET_MMU_STATE]
description: Apply the configured MMU status effect
gcode:
    _STATUS_BAR_SET_STATE STATE=MMU

[gcode_macro STATUS_BAR_CONFIGURE]
description: Persist K-Editor status bar settings without moving printer hardware
gcode:
    {% set STATES = ['STARTUP','STANDBY','HOMING','HEATING','PRINTING','PAUSED','MMU','COMPLETE','CANCELLED','ERROR'] %}
    SET_GCODE_VARIABLE MACRO=_STATUS_BAR_VARS VARIABLE=brightness VALUE={params.BRIGHTNESS|float}
    SET_GCODE_VARIABLE MACRO=_STATUS_BAR_VARS VARIABLE=automatic VALUE={params.AUTOMATIC|int}
    SAVE_VARIABLE VARIABLE=status_bar_brightness VALUE={params.BRIGHTNESS|float}
    SAVE_VARIABLE VARIABLE=status_bar_automatic VALUE={params.AUTOMATIC|int}
    {% for STATE in STATES %}
        {% set KEY = STATE|lower %}
        {% set EFFECT = params[STATE ~ '_EFFECT']|upper %}
        {% set COLOR = params[STATE ~ '_COLOR'] %}
        {% set SECONDARY = params[STATE ~ '_SECONDARY'] %}
        {% set SPEED = params[STATE ~ '_SPEED']|float %}
        SET_GCODE_VARIABLE MACRO=_STATUS_BAR_VARS VARIABLE={KEY}_effect VALUE='"{EFFECT}"'
        SET_GCODE_VARIABLE MACRO=_STATUS_BAR_VARS VARIABLE={KEY}_color VALUE='"{COLOR}"'
        SET_GCODE_VARIABLE MACRO=_STATUS_BAR_VARS VARIABLE={KEY}_secondary VALUE='"{SECONDARY}"'
        SET_GCODE_VARIABLE MACRO=_STATUS_BAR_VARS VARIABLE={KEY}_speed VALUE={SPEED}
        SAVE_VARIABLE VARIABLE=status_bar_{KEY}_effect VALUE='"{EFFECT}"'
        SAVE_VARIABLE VARIABLE=status_bar_{KEY}_color VALUE='"{COLOR}"'
        SAVE_VARIABLE VARIABLE=status_bar_{KEY}_secondary VALUE='"{SECONDARY}"'
        SAVE_VARIABLE VARIABLE=status_bar_{KEY}_speed VALUE={SPEED}
    {% endfor %}
    STATUS_BAR_RESTORE
    RESPOND TYPE=echo MSG="Status bar configuration saved"

[delayed_gcode STATUS_BAR_LOAD_CONFIG]
initial_duration: 1
gcode:
    {% set SAVED = printer.save_variables.variables %}
    {% set STATES = ['startup','standby','homing','heating','printing','paused','mmu','complete','cancelled','error'] %}
    {% if 'status_bar_brightness' in SAVED %}SET_GCODE_VARIABLE MACRO=_STATUS_BAR_VARS VARIABLE=brightness VALUE={SAVED.status_bar_brightness}{% endif %}
    {% if 'status_bar_automatic' in SAVED %}SET_GCODE_VARIABLE MACRO=_STATUS_BAR_VARS VARIABLE=automatic VALUE={SAVED.status_bar_automatic}{% endif %}
    {% for STATE in STATES %}
        {% for FIELD in ['effect','color','secondary','speed'] %}
            {% set KEY = 'status_bar_' ~ STATE ~ '_' ~ FIELD %}
            {% if KEY in SAVED %}
                SET_GCODE_VARIABLE MACRO=_STATUS_BAR_VARS VARIABLE={STATE}_{FIELD} VALUE={SAVED[KEY] if FIELD == 'speed' else '"' ~ SAVED[KEY] ~ '"'}
            {% endif %}
        {% endfor %}
    {% endfor %}

[delayed_gcode STATUS_BAR_AUTOMATION]
gcode:
    {% set V = printer['gcode_macro _STATUS_BAR_VARS'] %}
    {% set S = printer['gcode_macro STATUS_BAR_STATE'] %}
    {% set PRINT = printer.print_stats.state|default('standby')|lower %}
    {% set BED_TEMP = printer.heater_bed.temperature|float %}
    {% set BED_TARGET = printer.heater_bed.target|float %}
    {% set HOMED = printer.toolhead.homed_axes|lower %}
    {% set MMU_ACTION = printer.mmu.action|default('idle')|lower if printer.mmu is defined else 'idle' %}
    {% if V.automatic|int == 1 and S.manual|int == 0 %}
        {% if MMU_ACTION not in ['', 'idle', 'ready'] %}
            {% set NEXT = 'MMU' %}
        {% elif PRINT == 'paused' %}
            {% set NEXT = 'PAUSED' %}
        {% elif PRINT == 'printing' %}
            {% set NEXT = 'PRINTING' %}
        {% elif PRINT in ['complete', 'completed'] %}
            {% set NEXT = 'COMPLETE' %}
        {% elif PRINT in ['cancelled', 'canceled'] %}
            {% set NEXT = 'CANCELLED' %}
        {% elif BED_TARGET > 0 and BED_TEMP < BED_TARGET - 1 %}
            {% set NEXT = 'HEATING' %}
        {% elif HOMED != 'xyz' %}
            {% set NEXT = 'HOMING' %}
        {% else %}
            {% set NEXT = 'STANDBY' %}
        {% endif %}
        {% if S.state_name|upper != NEXT %}
            {% if NEXT == 'MMU' %}_STATUS_BAR_SET_MMU_STATE{% else %}_STATUS_BAR_SET_STATE STATE={NEXT}{% endif %}
        {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=STATUS_BAR_AUTOMATION DURATION=2
