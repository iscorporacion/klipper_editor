[printer]
kinematics: corexy
max_velocity: 800
max_accel: 5000
max_z_velocity: 20
max_z_accel: 50
square_corner_velocity: 5.0

[gcode_macro TEST_Z_OFFSET]
description: "Macro para calibrar y ajustar el Z-offset"
gcode:
    PROBE_CALIBRATE

[gcode_macro PID_EXTRUDER]
description: "Macro para calibrar PID EXTRUSOR"
gcode:
    PID_CALIBRATE HEATER=extruder TARGET=240

[gcode_macro PID_BED]
description: "Macro para calibrar PID BED"
gcode:
    PID_CALIBRATE HEATER=heater_bed TARGET=80
    
# [gcode_macro PRINT_START]
# #   Use PRINT_START for the slicer starting script - please customize for your slicer of choice
# gcode:
#     G28                            ; home all axes
#     # G90                            ; absolute positioning    
#     # G1 Z20 F3000                   ; move nozzle away from bed

[gcode_macro CANCEL_PRINT]
description: Cancelar la impresión, mover el cabezal y liberar motores
rename_existing: CANCEL_PRINT_BASE
gcode:
  CANCEL_PRINT_BASE            ; ✨ Cancela oficialmente la impresión en Klipper
  M400                         ; Esperar a que termine cualquier movimiento
  M104 S0                      ; Apagar el hotend
  M140 S0                      ; Apagar la cama
  {% set Y_MAX = printer.configfile.settings.stepper_y.position_max %}
  {% set X_MAX = printer.configfile.settings.stepper_x.position_max %}

  G91                          ; Modo relativo
  G1 Z10 F3000                 ; Subir Z para evitar golpes
  G90                          ; Modo absoluto
  G1 X{X_MAX} Y{Y_MAX} F6000         ; Mover a X=0, Y=max

  ; Apagar motores X e Y
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0

[probe_eddy_current btt_eddy]
descend_z: 2.5


