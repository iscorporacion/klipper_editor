# Purge tray: HOME=0 (top), positive travel moves down.
[include purge_tray_hardware.cfg]

[gcode_macro _PURGE_TRAY_VARS]
variable_profile_name: "Stealthburner"
variable_safe_position: 30.0
variable_purge_position: 25.0
variable_brush_position: 25.0
variable_drop_position: 50.0
variable_purge_x: 0.0
variable_purge_y: 0.0
variable_brush_x1: 0.0
variable_brush_x2: 0.0
variable_brush_y: 0.0
variable_odge_brush_y: 8.0
variable_purge_length: 60.0
variable_purge_speed: 8.0
variable_purge_temp_min: 180.0
variable_purge_descent_delay: 1300
variable_purge_velocity_fan: 0
variable_blob_descent: 5.0
variable_servo_receive_angle: 90.0
variable_servo_release_angle: 0.0
variable_servo_dwell: 700
variable_z_raise: 4.0
variable_brush_passes: 4
variable_tray_speed: 5.0
variable_safe_travel_speed: 6.0
variable_home_fast_speed: 5.0
variable_home_slow_speed: 1.0
variable_home_search_position: 65.0
variable_clear_x: 150.0
variable_clear_y: 350.0
variable_clear_z: 10.0
variable_bed_z_empty: 50.0
variable_max_blobs: 80
variable_calibrated: 0
gcode:

[gcode_macro _PURGE_TRAY_STATE]
variable_state: "idle"
variable_homed: 0
variable_position: 0.0
variable_target_position: 0.0
variable_progress: 0.0
variable_blob_count: 0
variable_max_blobs: 80
variable_last_error: ""
gcode:

[delayed_gcode _PURGE_TRAY_LOAD_PERSISTED]
initial_duration: 1.0
gcode:
  {% set saved = printer.save_variables.variables %}
  {% set vars = printer['gcode_macro _PURGE_TRAY_VARS'] %}
  {% set keys = ['safe_position','purge_position','brush_position','drop_position','purge_x','purge_y','brush_x1','brush_x2','brush_y','odge_brush_y','clear_z','bed_z_empty','purge_length','purge_descent_delay','purge_velocity_fan','blob_descent','safe_travel_speed','servo_receive_angle','servo_release_angle','servo_dwell','max_blobs','calibrated'] %}
  {% for key in keys %}
    {% set saved_key = 'purge_tray_' ~ key %}
    {% if saved_key in saved %}
      SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_VARS VARIABLE={key} VALUE={saved[saved_key]}
    {% endif %}
  {% endfor %}
  {% if 'purge_tray_profile_name' in saved %}
    SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_VARS VARIABLE=profile_name VALUE='"{saved.purge_tray_profile_name}"'
  {% endif %}
  {% set count = saved.purge_tray_blob_count|default(0)|int %}
  {% set maximum = saved.purge_tray_max_blobs|default(vars.max_blobs)|int %}
  SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=blob_count VALUE={count}
  SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=max_blobs VALUE={maximum}

[gcode_macro _PURGE_TRAY_SET_STATE]
gcode:
  {% set next_state = params.STATE|default("idle")|string %}
  SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=state VALUE='"{next_state}"'
  SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=progress VALUE={params.PROGRESS|default(0)|float}

[gcode_macro _PURGE_TRAY_CLEAR_TOOLHEAD]
description: Move the toolhead away before the tray rises
gcode:
  {% set v = printer['gcode_macro _PURGE_TRAY_VARS'] %}
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    {action_raise_error('Purge tray: XYZ homing required')}
  {% endif %}
  G90
  {% if printer.toolhead.position.z < v.clear_z %}
    G1 Z{v.clear_z} F600
  {% endif %}
  G1 X{v.clear_x} Y{v.clear_y} F9000

[gcode_macro PURGE_TRAY_HOME]
description: Double-tap HOME followed by mandatory move to safe position
gcode:
  {% set v = printer['gcode_macro _PURGE_TRAY_VARS'] %}
  _PURGE_TRAY_SET_STATE STATE=homing PROGRESS=0
  SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=homed VALUE=0
  SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=target_position VALUE=0
  _PURGE_TRAY_CLEAR_TOOLHEAD
  MANUAL_STEPPER STEPPER=purge_tray_lift ENABLE=1 SET_POSITION={v.home_search_position} SYNC=1
  MANUAL_STEPPER STEPPER=purge_tray_lift MOVE=0 SPEED={v.home_fast_speed} STOP_ON_ENDSTOP=home SYNC=1
  MANUAL_STEPPER STEPPER=purge_tray_lift MOVE=2 SPEED=4 SYNC=1
  MANUAL_STEPPER STEPPER=purge_tray_lift MOVE=0 SPEED={v.home_slow_speed} STOP_ON_ENDSTOP=home SYNC=1
  MANUAL_STEPPER STEPPER=purge_tray_lift SET_POSITION=0 SYNC=1
  _PURGE_TRAY_SET_STATE STATE=moving_safe PROGRESS=75
  SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=target_position VALUE={v.safe_position}
  MANUAL_STEPPER STEPPER=purge_tray_lift MOVE={v.safe_position} SPEED={v.safe_travel_speed} SYNC=1
  SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=position VALUE={v.safe_position}
  SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=homed VALUE=1
  _PURGE_TRAY_SET_STATE STATE=idle PROGRESS=100

[gcode_macro PURGE_TRAY_MOVE]
description: Absolute tray move after HOME
gcode:
  {% set v = printer['gcode_macro _PURGE_TRAY_VARS'] %}
  {% set s = printer['gcode_macro _PURGE_TRAY_STATE'] %}
  {% set pos = params.POS|default(-1)|float %}
  {% set quiet = params.QUIET|default(0)|int %}
  {% set speed = params.SPEED|default(v.tray_speed)|float %}
  {% if not s.homed|int %}
    {action_raise_error('Purge tray is not homed')}
  {% elif pos < 0 or pos > 50 %}
    {action_raise_error('Posicion fuera del rango 0..50')}
  {% else %}
    {% if not quiet %}_PURGE_TRAY_SET_STATE STATE=positioning PROGRESS=0{% endif %}
    SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=target_position VALUE={pos}
    MANUAL_STEPPER STEPPER=purge_tray_lift MOVE={pos} SPEED={speed} SYNC=1
    SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=position VALUE={pos}
    {% if not quiet %}_PURGE_TRAY_SET_STATE STATE=idle PROGRESS=100{% endif %}
  {% endif %}

[gcode_macro PURGE_TRAY_SAFE]
gcode:
  {% set v = printer['gcode_macro _PURGE_TRAY_VARS'] %}
  PURGE_TRAY_MOVE POS={v.safe_position} SPEED={v.safe_travel_speed}

[gcode_macro PURGE_TRAY_CALIBRATE_POSITION]
description: Move tray and toolhead to temporary unsaved calibration coordinates
gcode:
  {% set mode = params.MODE|default('')|upper %}
  {% set tray = params.TRAY|float %}
  {% set x = params.X|float %}
  {% set y = params.Y|float %}
  {% set v = printer['gcode_macro _PURGE_TRAY_VARS'] %}
  {% set s = printer['gcode_macro _PURGE_TRAY_STATE'] %}
  {% if mode not in ['PURGE', 'BRUSH_START', 'BRUSH_END'] %}
    {action_raise_error('Modo de calibracion invalido')}
  {% elif 'xyz' not in printer.toolhead.homed_axes %}
    {action_raise_error('Purge tray: XYZ homing required')}
  {% elif not s.homed|int %}
    {action_raise_error('Purge tray is not homed')}
  {% else %}
    _PURGE_TRAY_SET_STATE STATE=positioning PROGRESS=0
    G90
    {% if printer.toolhead.position.z < v.clear_z %}
      G1 Z{[v.clear_z, printer.toolhead.axis_maximum.z]|min} F600
    {% endif %}
    G1 X{x} Y{y} F9000
    PURGE_TRAY_MOVE POS={tray} QUIET=1
    _PURGE_TRAY_SET_STATE STATE=idle PROGRESS=100
  {% endif %}

[gcode_macro PURGE_TRAY_SERVO]
description: Test the configured receiving or releasing servo angle without moving other hardware
gcode:
  {% set v = printer['gcode_macro _PURGE_TRAY_VARS'] %}
  {% set position = params.POSITION|default('RECEIVE')|upper %}
  {% set angle = params.ANGLE|default(-1)|float %}
  {% if printer['servo purge_tray_bed'] is not defined %}
    {action_raise_error('Servo purge_tray_bed is not configured')}
  {% elif angle >= 0 and angle <= 180 %}
    SET_SERVO SERVO=purge_tray_bed ANGLE={angle}
  {% elif position == 'RECEIVE' %}
    SET_SERVO SERVO=purge_tray_bed ANGLE={v.servo_receive_angle}
  {% elif position == 'RELEASE' %}
    SET_SERVO SERVO=purge_tray_bed ANGLE={v.servo_release_angle}
  {% else %}
    {action_raise_error('Posicion de servo invalida: usa RECEIVE o RELEASE')}
  {% endif %}

[gcode_macro _PURGE_TRAY_CLEAN]
gcode:
  {% set v = printer['gcode_macro _PURGE_TRAY_VARS'] %}
  {% set skip_safe = params.SKIP_SAFE|default(0)|int %}
  {% set brush_first = params.BRUSH_FIRST|default(0)|int %}
  _PURGE_TRAY_SET_STATE STATE=cleaning PROGRESS=0
  {% if not skip_safe %}
    PURGE_TRAY_MOVE POS={v.safe_position} SPEED={v.safe_travel_speed} QUIET=1
  {% endif %}
  {% if brush_first %}
    PURGE_TRAY_MOVE POS={v.brush_position} QUIET=1
  {% endif %}
  G90
  {% if printer.toolhead.position.z < v.clear_z %}
    G1 Z{v.clear_z} F600
  {% endif %}
  G1 X{v.brush_x1} Y{v.brush_y} F9000
  {% if not brush_first %}
    PURGE_TRAY_MOVE POS={v.brush_position} QUIET=1
  {% endif %}
  {% for pass in range(v.brush_passes|int) %}
    G1 X{v.brush_x2} F3600
    G1 X{v.brush_x1} F3600
  {% endfor %}
  {% if v.odge_brush_y|float > 0 %}
    {% set exit_y = [printer.toolhead.axis_minimum.y, [v.brush_y - v.odge_brush_y, printer.toolhead.axis_maximum.y]|min]|max %}
    G1 Y{exit_y} F3600
  {% endif %}

[gcode_macro PURGE_TRAY_DROP]
gcode:
  {% set v = printer['gcode_macro _PURGE_TRAY_VARS'] %}
  {% set s = printer['gcode_macro _PURGE_TRAY_STATE'] %}
  {% set from_purge = params.FROM_PURGE|default(0)|int %}
  {% set open_position = [v.purge_position + v.blob_descent, 50.0]|min if from_purge else v.drop_position %}
  {% set knock_position = [open_position - (v.blob_descent * 0.90), 0.0]|max %}
  {% if not s.homed|int %}{action_raise_error('Purge tray is not homed')}{% endif %}
  {% if printer['servo purge_tray_bed'] is not defined %}{action_raise_error('Servo purge_tray_bed is not configured')}{% endif %}
  _PURGE_TRAY_SET_STATE STATE=dropping PROGRESS=0
  PURGE_TRAY_MOVE POS={open_position} QUIET=1
  SET_SERVO SERVO=purge_tray_bed ANGLE={v.servo_release_angle}
  G4 P{v.servo_dwell|int}
  PURGE_TRAY_MOVE POS={knock_position} QUIET=1
  SET_SERVO SERVO=purge_tray_bed ANGLE={v.servo_receive_angle}
  G4 P{v.servo_dwell|int}
  SET_SERVO SERVO=purge_tray_bed WIDTH=0
  {% set next_count = s.blob_count|int + 1 %}
  SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=blob_count VALUE={next_count}
  SAVE_VARIABLE VARIABLE=purge_tray_blob_count VALUE={next_count}
  {% if not from_purge %}
    PURGE_TRAY_MOVE POS={v.safe_position} SPEED={v.safe_travel_speed} QUIET=1
  {% endif %}
  {% if next_count >= v.max_blobs|int %}
    _PURGE_TRAY_SET_STATE STATE=full PROGRESS=100
  {% else %}
    _PURGE_TRAY_SET_STATE STATE=idle PROGRESS=100
  {% endif %}

[gcode_macro PURGE_TRAY_BLOBIFIER]
description: Fixed purge macro for Happy Hare
gcode:
  {% set v = printer['gcode_macro _PURGE_TRAY_VARS'] %}
  {% set s = printer['gcode_macro _PURGE_TRAY_STATE'] %}
  {% set gate = printer.mmu.gate|default(-1)|int %}
  {% set gate_temperatures = printer.mmu.gate_temperature|default([]) %}
  {% set gate_temperature = gate_temperatures[gate]|default(0)|float if gate >= 0 and gate < gate_temperatures|length else 0 %}
  {% set current_target = printer.extruder.target|default(0)|float %}
  {% set purge_temperature = gate_temperature if gate_temperature >= v.purge_temp_min else ([current_target, v.purge_temp_min]|max) %}
  {% set backup_fan_speed = printer.fan.speed|float if printer.fan is defined else 0 %}
  {% set initial_purge_length = v.purge_length * 0.30 %}
  {% set remaining_purge_length = v.purge_length - initial_purge_length %}
  {% set purge_end = [v.purge_position + v.blob_descent, 50.0]|min %}
  {% set purge_seconds = remaining_purge_length / v.purge_speed if remaining_purge_length > 0 and v.purge_speed > 0 else 1.0 %}
  {% set descent_speed = [[v.blob_descent / purge_seconds, 0.05]|max, v.tray_speed]|min if v.blob_descent > 0 else 0.05 %}
  {% if not v.calibrated|int %}
    {action_raise_error('Purge tray is not calibrated')}
  {% elif s.blob_count|int >= v.max_blobs|int %}
    SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=state VALUE='"full"'
    {action_raise_error('Deposito de purga lleno')}
  {% elif purge_temperature < 150 or purge_temperature > 350 %}
    {action_raise_error('Temperatura de purga invalida')}
  {% elif v.purge_length <= 0 or v.purge_speed <= 0 or v.blob_descent <= 0 or v.purge_position + v.blob_descent > 50 %}
    {action_raise_error('Longitud, velocidad o descenso de purga invalidos')}
  {% else %}
    {% if printer.extruder.temperature < purge_temperature - 2 %}
      _PURGE_TRAY_SET_STATE STATE=heating PROGRESS=0
      M109 S{purge_temperature}
    {% endif %}
    SAVE_GCODE_STATE NAME=PURGE_TRAY_BLOBIFIER_STATE
    {% if not s.homed|int %}PURGE_TRAY_HOME{% endif %}
    PURGE_TRAY_SAFE
    _PURGE_TRAY_CLEAR_TOOLHEAD
    G90
    {% if printer.toolhead.position.z < v.clear_z %}
      G1 Z{v.clear_z} F600
    {% endif %}
    PURGE_TRAY_MOVE POS={v.brush_position} QUIET=1
    G1 X{v.purge_x} Y{v.purge_y} F9000
    PURGE_TRAY_MOVE POS={v.purge_position} QUIET=1
    _PURGE_TRAY_SET_STATE STATE=purging PROGRESS=15
    M83
    M107
    G1 E{initial_purge_length} F{v.purge_speed * 60}
    {% if v.purge_descent_delay|int > 0 %}
      G4 P{v.purge_descent_delay|int}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=target_position VALUE={purge_end}
    MANUAL_STEPPER STEPPER=purge_tray_lift MOVE={purge_end} SPEED={descent_speed} SYNC=0
    G1 E{remaining_purge_length} F{v.purge_speed * 60}
    MANUAL_STEPPER STEPPER=purge_tray_lift MOVE={purge_end} SPEED={descent_speed} SYNC=1
    SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=position VALUE={purge_end}
    SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=progress VALUE=70
    G1 E-2 F300
    {% if v.purge_velocity_fan|int > 0 %}
      M106 S{[v.purge_velocity_fan|int, 255]|min}
    {% endif %}
    PURGE_TRAY_DROP FROM_PURGE=1
    _PURGE_TRAY_CLEAN SKIP_SAFE=1 BRUSH_FIRST=1
    M106 S{(backup_fan_speed * 255)|int}
    RESTORE_GCODE_STATE NAME=PURGE_TRAY_BLOBIFIER_STATE MOVE=1 MOVE_SPEED=150
    _PURGE_TRAY_SET_STATE STATE=idle PROGRESS=100
  {% endif %}

[gcode_macro PURGE_TRAY_TEST_PURGE]
gcode: PURGE_TRAY_BLOBIFIER

[gcode_macro PURGE_TRAY_TEST_CLEAN]
gcode:
  {% set s = printer['gcode_macro _PURGE_TRAY_STATE'] %}
  {% if not s.homed|int %}{action_raise_error('Purge tray is not homed')}{% endif %}
  SAVE_GCODE_STATE NAME=PURGE_TRAY_CLEAN_STATE
  _PURGE_TRAY_CLEAR_TOOLHEAD
  _PURGE_TRAY_CLEAN
  PURGE_TRAY_SAFE
  RESTORE_GCODE_STATE NAME=PURGE_TRAY_CLEAN_STATE MOVE=1 MOVE_SPEED=150
  _PURGE_TRAY_SET_STATE STATE=idle PROGRESS=100

[gcode_macro PURGE_TRAY_RESET_COUNT]
gcode:
  {% set v = printer['gcode_macro _PURGE_TRAY_VARS'] %}
  SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=blob_count VALUE=0
  SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=max_blobs VALUE={v.max_blobs}
  SAVE_VARIABLE VARIABLE=purge_tray_blob_count VALUE=0
  _PURGE_TRAY_SET_STATE STATE=idle PROGRESS=0

[gcode_macro PURGE_TRAY_EMPTY_START]
description: Move tray and bed for comfortable bucket emptying and open the moving bed
gcode:
  {% set v = printer['gcode_macro _PURGE_TRAY_VARS'] %}
  {% set s = printer['gcode_macro _PURGE_TRAY_STATE'] %}
  {% if not s.homed|int %}{action_raise_error('Purge tray is not homed')}{% endif %}
  {% if 'xyz' not in printer.toolhead.homed_axes %}{action_raise_error('Purge tray: XYZ homing required')}{% endif %}
  {% if printer['servo purge_tray_bed'] is not defined %}{action_raise_error('Servo purge_tray_bed is not configured')}{% endif %}
  _PURGE_TRAY_SET_STATE STATE=emptying PROGRESS=0
  PURGE_TRAY_MOVE POS=50 SPEED={v.safe_travel_speed} QUIET=1
  G90
  G1 Z{v.bed_z_empty} F600
  SET_SERVO SERVO=purge_tray_bed ANGLE={v.servo_release_angle}
  G4 P{v.servo_dwell|int}

[gcode_macro PURGE_TRAY_EMPTY_FINISH]
description: Close moving bed, return tray and bed to safe positions, then reset count
gcode:
  {% set v = printer['gcode_macro _PURGE_TRAY_VARS'] %}
  {% set s = printer['gcode_macro _PURGE_TRAY_STATE'] %}
  {% if not s.homed|int %}{action_raise_error('Purge tray is not homed')}{% endif %}
  {% if 'xyz' not in printer.toolhead.homed_axes %}{action_raise_error('Purge tray: XYZ homing required')}{% endif %}
  {% if printer['servo purge_tray_bed'] is not defined %}{action_raise_error('Servo purge_tray_bed is not configured')}{% endif %}
  SET_SERVO SERVO=purge_tray_bed ANGLE={v.servo_receive_angle}
  G4 P{v.servo_dwell|int}
  SET_SERVO SERVO=purge_tray_bed WIDTH=0
  PURGE_TRAY_SAFE
  G90
  G1 Z{v.clear_z} F600
  PURGE_TRAY_RESET_COUNT

[gcode_macro PURGE_TRAY_CONFIGURE]
description: Persist validated K-Editor settings without moving hardware
gcode:
  {% set profile = params.PROFILE|default('Custom')|string %}
  {% set values = {
    'safe_position': params.SAFE|float, 'purge_position': params.PURGE|float,
    'brush_position': params.BRUSH|float, 'drop_position': params.DROP|float,
    'purge_x': params.PURGE_X|float, 'purge_y': params.PURGE_Y|float, 'clear_z': params.BED_SAFE_Z|float,
    'bed_z_empty': params.BED_Z_EMPTY|default(printer['gcode_macro _PURGE_TRAY_VARS'].bed_z_empty)|float,
    'brush_x1': params.BRUSH_X1|float, 'brush_x2': params.BRUSH_X2|float,
    'brush_y': params.BRUSH_Y|float,
    'odge_brush_y': params.ODGE_BRUSH_Y|default(printer['gcode_macro _PURGE_TRAY_VARS'].odge_brush_y)|float,
    'purge_length': params.PURGE_LENGTH|float,
    'purge_descent_delay': params.PURGE_DESCENT_DELAY|default(printer['gcode_macro _PURGE_TRAY_VARS'].purge_descent_delay)|int,
    'purge_velocity_fan': params.PURGE_VELOCITY_FAN|default(printer['gcode_macro _PURGE_TRAY_VARS'].purge_velocity_fan)|int,
    'blob_descent': params.BLOB_DESCENT|float,
    'safe_travel_speed': params.SAFE_TRAVEL_SPEED|default(printer['gcode_macro _PURGE_TRAY_VARS'].safe_travel_speed)|float,
    'servo_receive_angle': params.SERVO_RECEIVE|float, 'servo_release_angle': params.SERVO_RELEASE|float,
    'servo_dwell': params.SERVO_DWELL|int, 'max_blobs': params.MAX_BLOBS|int
  } %}
  {% for key, value in values.items() %}
    SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_VARS VARIABLE={key} VALUE={value}
    SAVE_VARIABLE VARIABLE=purge_tray_{key} VALUE={value}
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_VARS VARIABLE=profile_name VALUE='"{profile}"'
  SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_VARS VARIABLE=calibrated VALUE=1
  SET_GCODE_VARIABLE MACRO=_PURGE_TRAY_STATE VARIABLE=max_blobs VALUE={values.max_blobs}
  SAVE_VARIABLE VARIABLE=purge_tray_profile_name VALUE='"{profile}"'
  SAVE_VARIABLE VARIABLE=purge_tray_calibrated VALUE=1
  RESPOND TYPE=echo MSG='Purge tray: configuration saved without movement'

[gcode_macro PURGE_TRAY_LIFT_HOME]
gcode: PURGE_TRAY_HOME

[gcode_macro PURGE_TRAY_LIFT_MAX]
gcode: PURGE_TRAY_MOVE POS=50

[gcode_macro PURGE_TRAY_LIFT_MOVE]
gcode: PURGE_TRAY_MOVE POS={params.POS}
