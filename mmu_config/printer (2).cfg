#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: -150
max_temp: 130
smooth_time: 3.0

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 2
max_error: 240
hysteresis: 5

