# Purge tray hardware. K-Editor creates this file once and never overwrites it.
# HOME=0 is the top position; positive travel moves the tray down.

[tmc2209 manual_stepper purge_tray_lift]
uart_pin: unit0:gpio9
uart_address: 1
run_current: 0.63
interpolate: True
sense_resistor: 0.110
stealthchop_threshold: 100

[manual_stepper purge_tray_lift]
step_pin: unit0:gpio19
dir_pin: unit0:gpio28
enable_pin: !unit0:gpio2
rotation_distance: 40
gear_ratio: 1:1
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^unit0:gpio16
position_min: 0
position_max: 50
velocity: 10
accel: 100

