[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^EBBCan:PB6
position_min: -30
position_endstop: 332
position_max: 332
homing_speed: 70
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 1 
sense_resistor: 0.110
hold_current: 0.500
stealthchop_threshold: 0

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PC0
position_endstop: 352
position_max: 352
position_min: -6
homing_speed: 70
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 1 
sense_resistor: 0.110
hold_current: 0.500
stealthchop_threshold: 0

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
full_steps_per_rotation:200
rotation_distance:8
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 500
position_min: -5
homing_speed: 50

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580 
# sense_resistor: 0.110
# hold_current: 0.500
stealthchop_threshold: 0


[stepper_z1]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
full_steps_per_rotation:200
rotation_distance:8
microsteps: 16
endstop_pin: probe:z_virtual_endstop

[tmc2209 stepper_z1]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.580
# sense_resistor: 0.110
# hold_current: 0.500
stealthchop_threshold: 0

[z_tilt]
z_positions:
    30,135
    318,135
points:
    30,150
    270,150
speed: 50
horizontal_move_z: 5

[heater_bed]
heater_pin: PC9
sensor_type: Generic 3950
sensor_pin: PC4
#control: pid
