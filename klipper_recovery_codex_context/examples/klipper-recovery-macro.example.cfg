# EJEMPLO CONCEPTUAL. ADAPTAR A LA CONFIGURACIÓN REAL.

[gcode_macro RECOVERY_CHECKPOINT]
description: Emit layer checkpoint to Klipper Editor Recovery Agent
gcode:
    {% set LAYER = params.LAYER|int %}
    {% set Z = params.Z|float %}
    {action_call_remote_method(
        "klipper_editor_recovery_checkpoint",
        layer=LAYER,
        z=Z
    )}

