# Status bar hardware. K-Editor creates this file once and never overwrites it.
# Change the pin, LED count and color order here for your installation.

[neopixel status_bar]
pin: PA8
chain_count: 18
color_order: GRB

# Default color: RGB(243, 232, 33)
initial_RED: 0.953
initial_GREEN: 0.910
initial_BLUE: 0.129
