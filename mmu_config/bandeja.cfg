# Purge tray: HOME=0 (top), positive travel moves down.
[tmc2209 manual_stepper auxiliar_z]
uart_pin: unit0:gpio9
uart_address: 1
run_current: 0.63
interpolate: True
sense_resistor: 0.110
stealthchop_threshold: 100

[manual_stepper auxiliar_z]
step_pin: unit0:gpio19
dir_pin: unit0:gpio28
enable_pin: !unit0:gpio2
rotation_distance: 40
gear_ratio: 1:1
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^unit0:gpio16
position_min: 0
position_max: 50
velocity: 10
accel: 100

# Uncomment after wiring the 9g servo and replace the pin.
# [servo bandeja_cama]
# pin: unit0:gpio22
# minimum_pulse_width: 0.0005
# maximum_pulse_width: 0.0025
# maximum_servo_angle: 180

[gcode_macro _BANDEJA_VARS]
variable_profile_name: "Stealthburner"
variable_safe_position: 30.0
variable_purge_position: 25.0
variable_brush_position: 25.0
variable_drop_position: 50.0
variable_purge_x: 0.0
variable_purge_y: 0.0
variable_purge_z: 0.0
variable_brush_x1: 0.0
variable_brush_x2: 0.0
variable_brush_y: 0.0
variable_brush_z: 0.0
variable_purge_length: 60.0
variable_purge_speed: 8.0
variable_purge_temp_min: 180.0
variable_blob_descent: 5.0
variable_servo_receive_angle: 90.0
variable_servo_release_angle: 0.0
variable_servo_dwell: 700
variable_z_raise: 4.0
variable_brush_passes: 4
variable_tray_speed: 5.0
variable_home_fast_speed: 5.0
variable_home_slow_speed: 1.0
variable_clear_x: 50.0
variable_clear_y: 50.0
variable_clear_z: 10.0
variable_max_blobs: 80
variable_calibrated: 0
gcode:

[gcode_macro _BANDEJA_STATE]
variable_state: "idle"
variable_homed: 0
variable_position: 0.0
variable_target_position: 0.0
variable_progress: 0.0
variable_blob_count: 0
variable_max_blobs: 80
variable_last_error: ""
gcode:

[delayed_gcode _BANDEJA_LOAD_PERSISTED]
initial_duration: 1.0
gcode:
  {% set saved = printer.save_variables.variables %}
  {% set vars = printer['gcode_macro _BANDEJA_VARS'] %}
  {% set keys = ['safe_position','purge_position','brush_position','drop_position','purge_x','purge_y','purge_z','brush_x1','brush_x2','brush_y','brush_z','purge_length','blob_descent','servo_receive_angle','servo_release_angle','servo_dwell','max_blobs','calibrated'] %}
  {% for key in keys %}
    {% set saved_key = 'bandeja_' ~ key %}
    {% if saved_key in saved %}
      SET_GCODE_VARIABLE MACRO=_BANDEJA_VARS VARIABLE={key} VALUE={saved[saved_key]}
    {% endif %}
  {% endfor %}
  {% if 'bandeja_profile_name' in saved %}
    SET_GCODE_VARIABLE MACRO=_BANDEJA_VARS VARIABLE=profile_name VALUE='"{saved.bandeja_profile_name}"'
  {% endif %}
  {% set count = saved.bandeja_blob_count|default(0)|int %}
  {% set maximum = saved.bandeja_max_blobs|default(vars.max_blobs)|int %}
  SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=blob_count VALUE={count}
  SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=max_blobs VALUE={maximum}

[gcode_macro _BANDEJA_SET_STATE]
gcode:
  {% set next_state = params.STATE|default("idle")|string %}
  SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=state VALUE='"{next_state}"'
  SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=progress VALUE={params.PROGRESS|default(0)|float}

[gcode_macro _BANDEJA_CLEAR_TOOLHEAD]
description: Move the toolhead away before the tray rises
gcode:
  {% set v = printer['gcode_macro _BANDEJA_VARS'] %}
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    {action_raise_error('Bandeja: XYZ requiere HOME')}
  {% endif %}
  G90
  {% if printer.toolhead.position.z < v.clear_z %}
    G1 Z{v.clear_z} F600
  {% endif %}
  G1 X{v.clear_x} Y{v.clear_y} F9000

[gcode_macro BANDEJA_HOME]
description: Double-tap HOME followed by mandatory move to safe position
gcode:
  {% set v = printer['gcode_macro _BANDEJA_VARS'] %}
  _BANDEJA_SET_STATE STATE=homing PROGRESS=0
  SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=homed VALUE=0
  SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=target_position VALUE=0
  _BANDEJA_CLEAR_TOOLHEAD
  MANUAL_STEPPER STEPPER=auxiliar_z ENABLE=1 SET_POSITION=50 SYNC=1
  MANUAL_STEPPER STEPPER=auxiliar_z MOVE=0 SPEED={v.home_fast_speed} STOP_ON_ENDSTOP=home SYNC=1
  MANUAL_STEPPER STEPPER=auxiliar_z MOVE=2 SPEED=4 SYNC=1
  MANUAL_STEPPER STEPPER=auxiliar_z MOVE=0 SPEED={v.home_slow_speed} STOP_ON_ENDSTOP=home SYNC=1
  MANUAL_STEPPER STEPPER=auxiliar_z SET_POSITION=0 SYNC=1
  _BANDEJA_SET_STATE STATE=moving_safe PROGRESS=75
  SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=target_position VALUE={v.safe_position}
  MANUAL_STEPPER STEPPER=auxiliar_z MOVE={v.safe_position} SPEED={v.tray_speed} SYNC=1
  SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=position VALUE={v.safe_position}
  SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=homed VALUE=1
  _BANDEJA_SET_STATE STATE=idle PROGRESS=100

[gcode_macro BANDEJA_MOVE]
description: Absolute tray move after HOME
gcode:
  {% set v = printer['gcode_macro _BANDEJA_VARS'] %}
  {% set s = printer['gcode_macro _BANDEJA_STATE'] %}
  {% set pos = params.POS|default(-1)|float %}
  {% set quiet = params.QUIET|default(0)|int %}
  {% if not s.homed|int %}
    {action_raise_error('Bandeja sin HOME')}
  {% elif pos < 0 or pos > 50 %}
    {action_raise_error('Posicion fuera del rango 0..50')}
  {% else %}
    {% if not quiet %}_BANDEJA_SET_STATE STATE=positioning PROGRESS=0{% endif %}
    SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=target_position VALUE={pos}
    MANUAL_STEPPER STEPPER=auxiliar_z MOVE={pos} SPEED={v.tray_speed} SYNC=1
    SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=position VALUE={pos}
    {% if not quiet %}_BANDEJA_SET_STATE STATE=idle PROGRESS=100{% endif %}
  {% endif %}

[gcode_macro BANDEJA_SAFE]
gcode:
  {% set v = printer['gcode_macro _BANDEJA_VARS'] %}
  BANDEJA_MOVE POS={v.safe_position}

[gcode_macro BANDEJA_SERVO]
description: Test the configured receiving or releasing servo angle without moving other hardware
gcode:
  {% set v = printer['gcode_macro _BANDEJA_VARS'] %}
  {% set position = params.POSITION|default('RECEIVE')|upper %}
  {% set angle = params.ANGLE|default(-1)|float %}
  {% if printer['servo bandeja_cama'] is not defined %}
    {action_raise_error('Servo bandeja_cama sin configurar')}
  {% elif angle >= 0 and angle <= 180 %}
    SET_SERVO SERVO=bandeja_cama ANGLE={angle}
  {% elif position == 'RECEIVE' %}
    SET_SERVO SERVO=bandeja_cama ANGLE={v.servo_receive_angle}
  {% elif position == 'RELEASE' %}
    SET_SERVO SERVO=bandeja_cama ANGLE={v.servo_release_angle}
  {% else %}
    {action_raise_error('Posicion de servo invalida: usa RECEIVE o RELEASE')}
  {% endif %}

[gcode_macro _BANDEJA_CLEAN]
gcode:
  {% set v = printer['gcode_macro _BANDEJA_VARS'] %}
  _BANDEJA_SET_STATE STATE=cleaning PROGRESS=0
  BANDEJA_MOVE POS={v.brush_position} QUIET=1
  G90
  G1 Z{v.brush_z + 3} F600
  G1 X{v.brush_x1} Y{v.brush_y} F9000
  G1 Z{v.brush_z} F300
  {% for pass in range(v.brush_passes|int) %}
    G1 X{v.brush_x2} F3600
    G1 X{v.brush_x1} F3600
  {% endfor %}
  G1 Z{v.brush_z + 3} F600

[gcode_macro BANDEJA_DROP]
gcode:
  {% set v = printer['gcode_macro _BANDEJA_VARS'] %}
  {% set s = printer['gcode_macro _BANDEJA_STATE'] %}
  {% if not s.homed|int %}{action_raise_error('Bandeja sin HOME')}{% endif %}
  {% if printer['servo bandeja_cama'] is not defined %}{action_raise_error('Servo bandeja_cama sin configurar')}{% endif %}
  _BANDEJA_SET_STATE STATE=dropping PROGRESS=0
  BANDEJA_MOVE POS={v.drop_position} QUIET=1
  SET_SERVO SERVO=bandeja_cama ANGLE={v.servo_release_angle}
  G4 P{v.servo_dwell|int}
  SET_SERVO SERVO=bandeja_cama ANGLE={v.servo_receive_angle}
  G4 P{v.servo_dwell|int}
  SET_SERVO SERVO=bandeja_cama WIDTH=0
  {% set next_count = s.blob_count|int + 1 %}
  SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=blob_count VALUE={next_count}
  SAVE_VARIABLE VARIABLE=bandeja_blob_count VALUE={next_count}
  BANDEJA_MOVE POS={v.safe_position} QUIET=1
  {% if next_count >= v.max_blobs|int %}
    _BANDEJA_SET_STATE STATE=full PROGRESS=100
  {% else %}
    _BANDEJA_SET_STATE STATE=idle PROGRESS=100
  {% endif %}

[gcode_macro BANDEJA_BLOBIFIER]
description: Fixed purge macro for Happy Hare
gcode:
  {% set v = printer['gcode_macro _BANDEJA_VARS'] %}
  {% set s = printer['gcode_macro _BANDEJA_STATE'] %}
  {% set gate = printer.mmu.gate|default(-1)|int %}
  {% set gate_temperatures = printer.mmu.gate_temperature|default([]) %}
  {% set gate_temperature = gate_temperatures[gate]|default(0)|float if gate >= 0 and gate < gate_temperatures|length else 0 %}
  {% set current_target = printer.extruder.target|default(0)|float %}
  {% set purge_temperature = gate_temperature if gate_temperature >= v.purge_temp_min else ([current_target, v.purge_temp_min]|max) %}
  {% set purge_end = [v.purge_position + v.blob_descent, 50.0]|min %}
  {% set purge_seconds = v.purge_length / v.purge_speed if v.purge_length > 0 and v.purge_speed > 0 else 1.0 %}
  {% set descent_speed = [[v.blob_descent / purge_seconds, 0.05]|max, v.tray_speed]|min if v.blob_descent > 0 else 0.05 %}
  {% if not v.calibrated|int %}
    {action_raise_error('Bandeja sin calibrar')}
  {% elif s.blob_count|int >= v.max_blobs|int %}
    SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=state VALUE='"full"'
    {action_raise_error('Deposito de purga lleno')}
  {% elif purge_temperature < 150 or purge_temperature > 350 %}
    {action_raise_error('Temperatura de purga invalida')}
  {% elif v.purge_length <= 0 or v.purge_speed <= 0 or v.blob_descent <= 0 or v.purge_position + v.blob_descent > 50 %}
    {action_raise_error('Longitud, velocidad o descenso de purga invalidos')}
  {% else %}
    {% if printer.extruder.temperature < purge_temperature - 2 %}
      _BANDEJA_SET_STATE STATE=heating PROGRESS=0
      M109 S{purge_temperature}
    {% endif %}
    SAVE_GCODE_STATE NAME=BANDEJA_BLOBIFIER_STATE
    {% if not s.homed|int %}BANDEJA_HOME{% endif %}
    _BANDEJA_CLEAR_TOOLHEAD
    G90
    G1 Z{v.purge_z + 3} F600
    G1 X{v.purge_x} Y{v.purge_y} F9000
    BANDEJA_MOVE POS={v.purge_position} QUIET=1
    G1 Z{v.purge_z} F300
    _BANDEJA_SET_STATE STATE=purging PROGRESS=15
    M83
    SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=target_position VALUE={purge_end}
    MANUAL_STEPPER STEPPER=auxiliar_z MOVE={purge_end} SPEED={descent_speed} SYNC=0
    G1 E{v.purge_length} F{v.purge_speed * 60}
    MANUAL_STEPPER STEPPER=auxiliar_z MOVE={purge_end} SPEED={descent_speed} SYNC=1
    SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=position VALUE={purge_end}
    SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=progress VALUE=70
    G1 E-2 F300
    _BANDEJA_CLEAN
    BANDEJA_DROP
    RESTORE_GCODE_STATE NAME=BANDEJA_BLOBIFIER_STATE MOVE=1 MOVE_SPEED=150
    _BANDEJA_SET_STATE STATE=idle PROGRESS=100
  {% endif %}

[gcode_macro BANDEJA_TEST_PURGE]
gcode: BANDEJA_BLOBIFIER

[gcode_macro BANDEJA_TEST_CLEAN]
gcode:
  {% set s = printer['gcode_macro _BANDEJA_STATE'] %}
  {% if not s.homed|int %}{action_raise_error('Bandeja sin HOME')}{% endif %}
  SAVE_GCODE_STATE NAME=BANDEJA_CLEAN_STATE
  _BANDEJA_CLEAR_TOOLHEAD
  _BANDEJA_CLEAN
  BANDEJA_SAFE
  RESTORE_GCODE_STATE NAME=BANDEJA_CLEAN_STATE MOVE=1 MOVE_SPEED=150
  _BANDEJA_SET_STATE STATE=idle PROGRESS=100

[gcode_macro BANDEJA_RESET_COUNT]
gcode:
  {% set v = printer['gcode_macro _BANDEJA_VARS'] %}
  SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=blob_count VALUE=0
  SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=max_blobs VALUE={v.max_blobs}
  SAVE_VARIABLE VARIABLE=bandeja_blob_count VALUE=0
  _BANDEJA_SET_STATE STATE=idle PROGRESS=0

[gcode_macro BANDEJA_CONFIGURE]
description: Persist validated K-Editor settings without moving hardware
gcode:
  {% set profile = params.PROFILE|default('Custom')|string %}
  {% set values = {
    'safe_position': params.SAFE|float, 'purge_position': params.PURGE|float,
    'brush_position': params.BRUSH|float, 'drop_position': params.DROP|float,
    'purge_x': params.PURGE_X|float, 'purge_y': params.PURGE_Y|float, 'purge_z': params.PURGE_Z|float,
    'brush_x1': params.BRUSH_X1|float, 'brush_x2': params.BRUSH_X2|float,
    'brush_y': params.BRUSH_Y|float, 'brush_z': params.BRUSH_Z|float,
    'purge_length': params.PURGE_LENGTH|float, 'blob_descent': params.BLOB_DESCENT|float,
    'servo_receive_angle': params.SERVO_RECEIVE|float, 'servo_release_angle': params.SERVO_RELEASE|float,
    'servo_dwell': params.SERVO_DWELL|int, 'max_blobs': params.MAX_BLOBS|int
  } %}
  {% for key, value in values.items() %}
    SET_GCODE_VARIABLE MACRO=_BANDEJA_VARS VARIABLE={key} VALUE={value}
    SAVE_VARIABLE VARIABLE=bandeja_{key} VALUE={value}
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=_BANDEJA_VARS VARIABLE=profile_name VALUE='"{profile}"'
  SET_GCODE_VARIABLE MACRO=_BANDEJA_VARS VARIABLE=calibrated VALUE=1
  SET_GCODE_VARIABLE MACRO=_BANDEJA_STATE VARIABLE=max_blobs VALUE={values.max_blobs}
  SAVE_VARIABLE VARIABLE=bandeja_profile_name VALUE='"{profile}"'
  SAVE_VARIABLE VARIABLE=bandeja_calibrated VALUE=1
  RESPOND TYPE=echo MSG='Bandeja: configuracion guardada sin movimientos'

[gcode_macro HOME_AUXILIAR_Z]
gcode: BANDEJA_HOME

[gcode_macro AUXILIAR_Z_FINAL]
gcode: BANDEJA_MOVE POS=50

[gcode_macro AUXILIAR_Z_MOVE]
gcode: BANDEJA_MOVE POS={params.POS}
